schema_version: 1
kind: app_definition
id: retroarch
name: RetroArch (AArch64)
description: Multi-system emulator frontend.
category: emulator
package_id: com.retroarch.aarch64
launcher_activity: com.retroarch.browser.mainmenu.MainMenuActivity
artifacts:
  apk:
    kind: apk
    name: RetroArch APK
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/RetroArch_aarch64.apk
  asset_assets_zip:
    kind: file
    name: RetroArch frontend assets archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/assets.zip
  asset_autoconfig_zip:
    kind: file
    name: RetroArch autoconfig archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/autoconfig.zip
  asset_cheats_zip:
    kind: file
    name: RetroArch cheats archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/cheats.zip
  asset_database_rdb_zip:
    kind: file
    name: RetroArch database archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/database-rdb.zip
  asset_info_zip:
    kind: file
    name: RetroArch information archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/info.zip
  asset_overlays_zip:
    kind: file
    name: RetroArch overlays archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/overlays.zip
  asset_shaders_glsl_zip:
    kind: file
    name: RetroArch GLSL shaders archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/frontend/shaders_glsl.zip
  core_dolphin_zip:
    kind: file
    name: Dolphin core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/dolphin_libretro_android.so.zip
  core_fbneo_zip:
    kind: file
    name: FinalBurn Neo core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fbneo_libretro_android.so.zip
  core_fceumm_zip:
    kind: file
    name: FCEUmm core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fceumm_libretro_android.so.zip
  core_flycast_zip:
    kind: file
    name: Flycast core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/flycast_libretro_android.so.zip
  core_gambatte_zip:
    kind: file
    name: Gambatte core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/gambatte_libretro_android.so.zip
  core_genesis_plus_gx_zip:
    kind: file
    name: Genesis Plus GX core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/genesis_plus_gx_libretro_android.so.zip
  core_handy_zip:
    kind: file
    name: Handy core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/handy_libretro_android.so.zip
  core_mednafen_saturn_zip:
    kind: file
    name: Mednafen Saturn core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mednafen_saturn_libretro_android.so.zip
  core_melondsds_zip:
    kind: file
    name: melonDS DS core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/melondsds_libretro_android.so.zip
  core_mupen64plus_next_gles3_zip:
    kind: file
    name: Mupen64Plus Next GLES3 core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mupen64plus_next_gles3_libretro_android.so.zip
  core_pokemini_zip:
    kind: file
    name: Pokémon Mini core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pokemini_libretro_android.so.zip
  core_ppsspp_zip:
    kind: file
    name: PPSSPP core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/ppsspp_libretro_android.so.zip
  core_snes9x_zip:
    kind: file
    name: Snes9x core archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip
  core_files_dolphin_zip:
    kind: file
    name: Dolphin system files archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/system/Dolphin.zip
  core_files_fbneo_zip:
    kind: file
    name: FinalBurn Neo system files archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/system/FinalBurn%20Neo%20%28hiscore%29.zip
  core_files_ppsspp_zip:
    kind: file
    name: PPSSPP system files archive
    source:
      strategy: direct_url
      url: https://buildbot.libretro.com/assets/system/PPSSPP.zip
permission_sets:
  baseline:
    runtime:
    - permission: android.permission.POST_NOTIFICATIONS
      android_api_min: 33
    - permission: android.permission.READ_EXTERNAL_STORAGE
      android_api_min: 33
    - permission: android.permission.READ_MEDIA_IMAGES
      android_api_min: 33
    - permission: android.permission.READ_MEDIA_AUDIO
      android_api_min: 33
    - permission: android.permission.READ_MEDIA_VIDEO
      android_api_min: 33
    - permission: android.permission.WRITE_EXTERNAL_STORAGE
      android_api_min: 33
    - permission: android.permission.ACCESS_MEDIA_LOCATION
      android_api_min: 33
  elevated:
    app_ops:
    - op: MANAGE_EXTERNAL_STORAGE
      mode: allow
targets:
  storage_root:
    kind: directory
    location: shared_storage
    path: RetroArch
  system:
    kind: directory
    location: shared_storage
    path: RetroArch/system
  system_dolphin_emu:
    kind: directory
    location: shared_storage
    path: RetroArch/system/dolphin-emu
  system_fbneo:
    kind: directory
    location: shared_storage
    path: RetroArch/system/fbneo
  system_ppsspp:
    kind: directory
    location: shared_storage
    path: RetroArch/system/PPSSPP
  cheats:
    kind: directory
    location: shared_storage
    path: RetroArch/cheats
  assets:
    kind: directory
    location: app_data
    path: assets
  autoconfig:
    kind: directory
    location: app_data
    path: autoconfig
  cores:
    kind: directory
    location: app_data
    path: cores
  database_rdb:
    kind: directory
    location: app_data
    path: database/rdb
  info:
    kind: directory
    location: app_data
    path: info
  overlays:
    kind: directory
    location: app_data
    path: overlays
  shaders_glsl:
    kind: directory
    location: app_data
    path: shaders/shaders_glsl
  config:
    kind: file
    location: external_app_data
    path: files/retroarch.cfg
metadata:
  homepage: https://www.retroarch.com/
  tags:
    - emulator
    - frontend
