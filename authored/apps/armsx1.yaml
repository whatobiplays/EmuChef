schema_version: 1
kind: app_definition
id: armsx1
name: ARMSX1
description: PlayStation 2 emulator for Android.
category: emulator
package_id: com.nanodata.armsx
artifacts:
  apk:
    kind: apk
    name: ARMSX1 APK
    source:
      strategy: latest_release
      provider: github
      base_url: https://github.com
      repository: ARMSX2/ARMSX1
      asset_pattern: '^ARMSX1-release-[0-9]{8}-arm64-v8a\.apk$'
      prerelease: false
metadata:
  homepage: https://github.com/ARMSX2/ARMSX1
  tags:
    - emulator
    - playstation-2
