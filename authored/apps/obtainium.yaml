schema_version: 1
kind: app_definition
id: obtainium
name: Obtainium
description: APK update tracker.
category: utility
package_id: dev.imranr.obtainium
artifacts:
  apk:
    kind: apk
    name: Obtainium APK
    source:
      strategy: latest_release
      provider: github
      base_url: https://github.com
      repository: ImranR98/Obtainium
      asset_pattern: '^app-release\.apk$'
      prerelease: false
metadata:
  homepage: https://github.com/ImranR98/Obtainium
  tags:
    - updater
