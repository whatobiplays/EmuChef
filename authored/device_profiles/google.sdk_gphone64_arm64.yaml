schema_version: 1
kind: device_profile
id: google.sdk_gphone64_arm64
name: Google Android Emulator ARM64 API 36
description: Android 16 (API 36) ARM64 emulator profile for validating app recipes.
match:
  manufacturer_contains:
  - Google
  brand_contains:
  - google
  model_patterns:
  - ^sdk_gphone64_arm64$
  android_version:
    min: 16
capability_defaults:
  adb_available: true
  apk_install: true
  shared_storage_write: true
  app_launch: true
  shell_command: true
  package_remove_for_user: false
  root_shell: false
  app_data_write: false
device_tags:
- android_emulator
- arm64
- api_36
metadata:
  vendor: Google
  product: sdk_gphone64_arm64
  android_release: '16'
  android_api_level: 36
  abi: arm64-v8a
  device_class: android_emulator
