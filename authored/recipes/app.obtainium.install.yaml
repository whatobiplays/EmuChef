schema_version: 1
kind: recipe
id: app.obtainium.install
name: Install Obtainium
description: Install Obtainium for tracking emulator APKs.
recipe_dependencies: []
provides:
  features:
    - obtainium_install
artifacts:
  obtainium_apk:
    type: app_artifact
    app_ref: obtainium
    artifact: apk
    cache: default
steps:
  - id: resolve_artifacts
    type: resolve_artifacts
    name: Resolve Obtainium APK
    user_toggleable: false
    dependencies: []
    constraints:
      capabilities: []
      conflicts_with: []
    params:
      artifacts:
        - obtainium_apk
    verify: []
  - id: install_obtainium
    type: install_apk
    name: Install Obtainium
    user_toggleable: false
    app_ref: obtainium
    dependencies:
      - resolve_artifacts
    constraints:
      capabilities:
        - apk_install
      conflicts_with: []
    skip_if:
      - type: package_installed
        params: {}
    params:
      app:
        ref: artifacts.obtainium_apk.local_path
      replace_existing: false
    verify: []
