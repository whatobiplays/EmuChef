schema_version: 1
kind: recipe
id: app.armsx1.install
name: Install or update ARMSX1
description: Install or update the latest stable ARMSX1 Android release. The current release targets arm64-v8a devices running Android 8.0 (API 26) or later.
recipe_dependencies: []
provides:
  features:
    - armsx1_install
artifacts:
  installer:
    type: app_artifact
    app_ref: armsx1
    artifact: apk
steps:
  - id: resolve_armsx1_apk
    type: resolve_artifacts
    name: Resolve ARMSX1 APK
    user_toggleable: false
    dependencies: []
    constraints:
      capabilities: []
      conflicts_with: []
    params:
      artifacts:
        - installer
    verify: []
  - id: install_armsx1
    type: install_apk
    name: Install or update ARMSX1
    user_toggleable: false
    app_ref: armsx1
    dependencies:
      - resolve_armsx1_apk
    constraints:
      capabilities:
        - apk_install
      conflicts_with: []
    skip_if: []
    params:
      app:
        ref: artifacts.installer.local_path
      replace_existing: true
    verify:
      - type: package_installed
        params: {}
