schema_version: 1
kind: recipe
id: app.xaniteog.install
name: Install XaniteOG
description: Install the Xbox emulator XaniteOG.
provides:
  features:
    - xaniteog_install
inputs:
  xaniteog_apk:
    type: file
    role: apk
    label: XaniteOG APK
    description: Local XaniteOG APK to install.
    required: true
    multiple: false
    validation:
      must_exist: true
      allowed_extensions: ["apk"]
      path_kind: file
    default: null
artifacts:
  xaniteog_apk:
    type: app_artifact
    app_ref: xaniteog
    artifact: apk
    input:
      ref: inputs.xaniteog_apk
    cache: none
steps:
  - id: resolve_xaniteog_artifacts
    type: resolve_artifacts
    name: Resolve XaniteOG APK
    user_toggleable: false
    dependencies: []
    constraints:
      capabilities: []
      conflicts_with: []
    params:
      artifacts:
        - xaniteog_apk
    verify: []
  - id: install_xaniteog
    type: install_apk
    app_ref: xaniteog
    name: Install XaniteOG APK
    progress_note: Installing XaniteOG on the selected device
    user_toggleable: false
    dependencies:
      - resolve_xaniteog_artifacts
    constraints:
      capabilities:
        - apk_install
      conflicts_with: []
    skip_if:
      - type: package_installed
        params: {}
    params:
      app:
        ref: artifacts.xaniteog_apk.local_path
      replace_existing: false
    verify: []
