schema_version: 1
kind: recipe
id: app.xaniteog.install
name: Install XaniteOG
description: Install the Xbox emulator XaniteOG.
provides:
  features:
    - xaniteog_install
inputs:
  xaniteog_apk:
    type: file
    role: apk
    label: XaniteOG APK
    description: Local XaniteOG APK to install.
    required: true
    multiple: false
    validation:
      must_exist: true
      allowed_extensions: ["apk"]
      path_kind: file
    default: null
steps:
  - id: install_xaniteog
    type: install_apk
    name: Install XaniteOG APK
    progress_note: Installing XaniteOG on the selected device
    user_toggleable: false
    dependencies: []
    constraints:
      capabilities:
        - apk_install
      conflicts_with: []
    skip_if:
      - type: package_installed
        params:
          package_name: Ali.Xanite
    params:
      app:
        ref: inputs.xaniteog_apk
      replace_existing: false
    verify: []
