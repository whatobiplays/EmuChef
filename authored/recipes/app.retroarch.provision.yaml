schema_version: 1
kind: recipe
id: app.retroarch.provision
name: Provision RetroArch (AArch64)
description: Install RetroArch, bootstrap permissions, seed config, copy selected
  cores, then relaunch.
recipe_dependencies: []
provides:
  features:
  - retroarch_provision
inputs:
  retroarch_cfg:
    type: file
    role: generic
    label: RetroArch config
    description: RetroArch config file.
    required: false
    multiple: false
    validation:
      must_exist: true
      allowed_extensions:
      - cfg
      path_kind: file
    default: null
artifacts:
  retroarch_apk:
    type: app_artifact
    app_ref: retroarch
    artifact: apk
    cache: default
  asset_assets_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_assets_zip
    cache: default
  asset_autoconfig_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_autoconfig_zip
    cache: default
  asset_cheats_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_cheats_zip
    cache: default
  asset_database_rdb_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_database_rdb_zip
    cache: default
  asset_info_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_info_zip
    cache: default
  asset_overlays_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_overlays_zip
    cache: default
  asset_shaders_glsl_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: asset_shaders_glsl_zip
    cache: default
  core_dolphin_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_dolphin_zip
    cache: default
  core_fbneo_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_fbneo_zip
    cache: default
  core_fceumm_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_fceumm_zip
    cache: default
  core_flycast_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_flycast_zip
    cache: default
  core_gambatte_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_gambatte_zip
    cache: default
  core_genesis_plus_gx_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_genesis_plus_gx_zip
    cache: default
  core_handy_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_handy_zip
    cache: default
  core_mednafen_saturn_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_mednafen_saturn_zip
    cache: default
  core_melondsds_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_melondsds_zip
    cache: default
  core_mupen64plus_next_gles3_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_mupen64plus_next_gles3_zip
    cache: default
  core_pokemini_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_pokemini_zip
    cache: default
  core_ppsspp_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_ppsspp_zip
    cache: default
  core_snes9x_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_snes9x_zip
    cache: default
  core_files_dolphin_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_files_dolphin_zip
    cache: default
  core_files_fbneo_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_files_fbneo_zip
    cache: default
  core_files_ppsspp_zip:
    type: app_artifact
    app_ref: retroarch
    artifact: core_files_ppsspp_zip
    cache: default
artifact_groups:
  retroarch_assets:
  - asset_assets_zip
  - asset_autoconfig_zip
  - asset_cheats_zip
  - asset_database_rdb_zip
  - asset_info_zip
  - asset_overlays_zip
  - asset_shaders_glsl_zip
  retroarch_cores:
  - core_dolphin_zip
  - core_fbneo_zip
  - core_fceumm_zip
  - core_flycast_zip
  - core_gambatte_zip
  - core_genesis_plus_gx_zip
  - core_handy_zip
  - core_mednafen_saturn_zip
  - core_melondsds_zip
  - core_mupen64plus_next_gles3_zip
  - core_pokemini_zip
  - core_ppsspp_zip
  - core_snes9x_zip
  retroarch_core_system_files:
  - core_files_dolphin_zip
  - core_files_fbneo_zip
  - core_files_ppsspp_zip
steps:
- id: resolve_artifacts
  type: resolve_artifacts
  name: Resolve RetroArch artifacts
  user_toggleable: false
  dependencies: []
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    artifacts:
    - retroarch_apk
    artifact_groups:
    - retroarch_assets
    - retroarch_cores
    - retroarch_core_system_files
  verify: []
- id: install_retroarch
  type: install_apk
  app_ref: retroarch
  name: Install RetroArch
  description: Install the RetroArch APK.
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities:
    - apk_install
    conflicts_with: []
  skip_if:
  - type: package_installed
    params: {}
  params:
    app:
      ref: artifacts.retroarch_apk.local_path
    replace_existing: false
  verify: []
- id: launch_retroarch_bootstrap
  type: launch_app
  app_ref: retroarch
  name: Launch RetroArch for bootstrap
  description: Launch RetroArch once so it can initialize its storage and defaults.
  user_toggleable: false
  dependencies:
  - install_retroarch
  constraints:
    capabilities:
    - app_launch
    conflicts_with: []
  skip_if: []
  params: {}
  verify: []
- id: wait_for_retroarch_bootstrap
  type: wait
  name: Wait for RetroArch bootstrap
  description: Pause briefly to let RetroArch finish bootstrap work.
  user_toggleable: false
  dependencies:
  - launch_retroarch_bootstrap
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    duration_ms: 1500
  verify: []
- id: stop_retroarch_after_bootstrap
  type: force_stop_app
  app_ref: retroarch
  name: Force stop RetroArch after bootstrap
  user_toggleable: false
  dependencies:
  - wait_for_retroarch_bootstrap
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params: {}
  verify: []
- id: grant_retroarch_baseline
  type: grant_permissions
  app_ref: retroarch
  name: Grant RetroArch baseline permissions
  description: Apply the App Definition's baseline runtime permissions.
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_bootstrap
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    permission_set: baseline
    policy:
      on_failure: warn
  verify: []
- id: grant_retroarch_elevated
  type: grant_permissions
  app_ref: retroarch
  name: Grant RetroArch elevated permissions
  description: Apply elevated all-files access on rooted devices; this step is omitted on unrooted devices.
  user_toggleable: false
  dependencies:
  - grant_retroarch_baseline
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    permission_set: elevated
    policy:
      on_failure: warn
  verify: []
- id: launch_retroarch_permissions
  type: launch_app
  app_ref: retroarch
  name: Launch RetroArch after permissions
  description: Launch RetroArch once so it can initialize its storage and defaults.
  user_toggleable: false
  dependencies:
  - grant_retroarch_baseline
  constraints:
    capabilities:
    - app_launch
    conflicts_with: []
  skip_if: []
  params: {}
  verify: []
- id: wait_for_retroarch_permissions
  type: wait
  name: Wait for RetroArch permissions
  description: Pause briefly to let RetroArch finish permissions work.
  user_toggleable: false
  dependencies:
  - launch_retroarch_permissions
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    duration_ms: 5000
  verify: []
- id: stop_retroarch_after_permissions
  type: force_stop_app
  app_ref: retroarch
  name: Force stop RetroArch
  description: Force stop RetroArch after the permissions launch.
  user_toggleable: false
  dependencies:
  - wait_for_retroarch_permissions
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params: {}
  verify: []
- id: extract_assets
  type: extract_archive
  name: Extract RetroArch assets
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_assets_zip.local_path
    extract_on: host
  verify: []
- id: copy_assets
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch assets
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_assets
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_assets
    dest:
      app_target: assets
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: assets
- id: extract_autoconfig
  type: extract_archive
  name: Extract RetroArch autoconfig
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_autoconfig_zip.local_path
    extract_on: host
  verify: []
- id: copy_autoconfig
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch autoconfig
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_autoconfig
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_autoconfig
    dest:
      app_target: autoconfig
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: autoconfig
- id: extract_cheats
  type: extract_archive
  name: Extract RetroArch cheats
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_cheats_zip.local_path
    extract_on: host
  verify: []
- id: copy_cheats
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch cheats
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_cheats
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_cheats
    dest:
      app_target: cheats
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: cheats
- id: extract_database_rdb
  type: extract_archive
  name: Extract RetroArch database
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_database_rdb_zip.local_path
    extract_on: host
  verify: []
- id: copy_database_rdb
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch database
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_database_rdb
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_database_rdb
    dest:
      app_target: database_rdb
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: database_rdb
- id: extract_info
  type: extract_archive
  name: Extract RetroArch info
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_info_zip.local_path
    extract_on: host
  verify: []
- id: copy_info
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch info
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_info
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_info
    dest:
      app_target: info
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: info
- id: extract_overlays
  type: extract_archive
  name: Extract RetroArch overlays
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_overlays_zip.local_path
    extract_on: host
  verify: []
- id: copy_overlays
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch overlays
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_overlays
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_overlays
    dest:
      app_target: overlays
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: overlays
- id: extract_shaders_glsl
  type: extract_archive
  name: Extract RetroArch GLSL shaders
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    archive:
      ref: artifacts.asset_shaders_glsl_zip.local_path
    extract_on: host
  verify: []
- id: copy_shaders_glsl
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch GLSL shaders
  user_toggleable: false
  dependencies:
  - stop_retroarch_after_permissions
  - extract_shaders_glsl
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_shaders_glsl
    dest:
      app_target: shaders_glsl
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: shaders_glsl
- id: extract_cores
  type: extract_artifacts
  name: Extract selected RetroArch cores
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    artifact_groups:
    - retroarch_cores
    extract_on: host
  verify: []
- id: copy_cores
  type: copy_files
  app_ref: retroarch
  name: Copy selected RetroArch cores
  user_toggleable: true
  dependencies:
  - stop_retroarch_after_permissions
  - extract_cores
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_cores
    dest:
      app_target: cores
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: cores
- id: extract_core_system_files
  type: extract_artifacts
  name: Extract selected RetroArch core system files
  user_toggleable: false
  dependencies:
  - resolve_artifacts
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    artifact_groups:
    - retroarch_core_system_files
    extract_on: host
  verify: []
- id: copy_core_system_files
  type: copy_files
  app_ref: retroarch
  name: Copy selected RetroArch core system files
  user_toggleable: true
  dependencies:
  - stop_retroarch_after_permissions
  - extract_core_system_files
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: steps.extract_core_system_files
    dest:
      app_target: system
    copy_policy: merge
  verify:
  - type: path_exists
    params:
      path:
        app_target: system_dolphin_emu
  - type: path_exists
    params:
      path:
        app_target: system_fbneo
  - type: path_exists
    params:
      path:
        app_target: system_ppsspp
- id: seed_retroarch_cfg
  type: copy_files
  app_ref: retroarch
  name: Copy RetroArch config
  description: Copy the config file into Android/data folder.
  user_toggleable: true
  dependencies:
  - stop_retroarch_after_permissions
  constraints:
    capabilities: []
    conflicts_with: []
  skip_if: []
  params:
    source:
      ref: inputs.retroarch_cfg
    dest:
      app_target: config
    copy_policy: replace
  verify:
  - type: file_exists
    params:
      path:
        app_target: config
- id: launch_retroarch
  type: launch_app
  app_ref: retroarch
  name: Launch RetroArch
  description: Launch RetroArch again after permissions and optional config seeding.
  user_toggleable: true
  dependencies:
  - copy_assets
  - copy_autoconfig
  - copy_cheats
  - copy_database_rdb
  - copy_info
  - copy_overlays
  - copy_shaders_glsl
  - copy_cores
  - copy_core_system_files
  constraints:
    capabilities:
    - app_launch
    conflicts_with: []
  skip_if: []
  params: {}
  verify: []
