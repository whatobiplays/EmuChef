[package]
name = "emuchef-app"
version = "0.1.0"
description = "EmuChef end-user review and simulated-execution application"
edition = "2021"

[features]
default = []
real-execution = []

[build-dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
async-io = "2.6.0"
async-process = "2.5.0"
futures-lite = "2.6.1"
hex = "0.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
ring = "=0.17.14"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.0"
time = { version = "=0.3.53", features = ["formatting", "parsing"] }
uuid = { version = "1.18", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
emuchef-rust-backend = { path = "../../../crates/emuchef-rust-backend" }
tauri = { version = "2.11.0", features = ["test"] }
tempfile = "3.20"

[lib]
name = "emuchef_app_lib"
path = "src/lib.rs"
