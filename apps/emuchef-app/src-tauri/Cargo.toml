[package]
name = "emuchef-app"
version = "0.1.0"
description = "EmuChef end-user review and simulated-execution application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
hex = "0.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.0"
uuid = { version = "1.18", features = ["v4"] }
wait-timeout = "0.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
emuchef-rust-backend = { path = "../../../crates/emuchef-rust-backend" }
tempfile = "3.20"

[lib]
name = "emuchef_app_lib"
path = "src/lib.rs"
