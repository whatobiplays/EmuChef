name: EmuChef macOS qualification

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.pyw"
      - "**/*.pyc"
      - "pyproject.toml"
      - "requirements*.txt"
      - "Pipfile*"
      - "poetry.lock"
      - "uv.lock"
      - "scripts/**"
      - "apps/config-editor/package.json"
      - "apps/emuchef-app/**"
      - "crates/emuchef-rust-backend/**"
      - "authored/**"
      - ".github/workflows/emuchef-macos-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-runtime-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Python runtime retirement
        run: node --test --experimental-test-coverage --test-coverage-include=scripts/check-python-runtime-retirement.mjs --test-coverage-lines=95 --test-coverage-functions=95 --test-coverage-branches=95 scripts/check-python-runtime-retirement.test.mjs && node scripts/check-python-runtime-retirement.mjs

  normalized-repeatability:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/emuchef-app/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci --prefix apps/emuchef-app
      - name: Verify packaging policy
        run: npm --prefix apps/emuchef-app run test:packaging
      - name: Build and qualify first local artifact
        run: npm --prefix apps/emuchef-app run package:macos:qualify -- --manifest "$RUNNER_TEMP/first.json"
      - name: Build and qualify second local artifact
        run: npm --prefix apps/emuchef-app run package:macos:qualify -- --manifest "$RUNNER_TEMP/second.json"
      - name: Compare normalized content
        run: npm --prefix apps/emuchef-app run package:macos:compare -- "$RUNNER_TEMP/first.json" "$RUNNER_TEMP/second.json"
      - name: Retain sanitized qualification manifests
        uses: actions/upload-artifact@v7
        with:
          name: emuchef-macos-normalized-manifests
          path: |
            ${{ runner.temp }}/first.json
            ${{ runner.temp }}/second.json
          if-no-files-found: error
          retention-days: 14
