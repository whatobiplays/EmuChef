name: EmuChef execution feature matrix

on:
  pull_request:
    paths:
      - ".github/workflows/emuchef-execution-feature-matrix.yml"
      - "apps/emuchef-app/package.json"
      - "apps/emuchef-app/src-tauri/**"
      - "apps/emuchef-app/tests/security-policy.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emuchef-execution-feature-matrix.yml"
      - "apps/emuchef-app/package.json"
      - "apps/emuchef-app/src-tauri/**"
      - "apps/emuchef-app/tests/security-policy.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emuchef-execution-feature-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    name: Execution feature policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/emuchef-app/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci --prefix apps/emuchef-app
      - name: Verify execution feature policy
        run: npm --prefix apps/emuchef-app run test:security

  rust-feature-matrix:
    name: Tauri Rust (${{ matrix.configuration }})
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: simulation-only
            cargo_arguments: --no-default-features
          - configuration: real-execution
            cargo_arguments: --no-default-features --features real-execution
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/emuchef-app/src-tauri
      - name: Check formatting
        run: cargo fmt --manifest-path apps/emuchef-app/src-tauri/Cargo.toml -- --check
      - name: Check Tauri Rust configuration
        run: cargo check --locked --manifest-path apps/emuchef-app/src-tauri/Cargo.toml ${{ matrix.cargo_arguments }}
      - name: Test Tauri Rust configuration
        run: cargo test --locked --manifest-path apps/emuchef-app/src-tauri/Cargo.toml ${{ matrix.cargo_arguments }}
