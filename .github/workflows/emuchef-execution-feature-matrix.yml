name: EmuChef execution feature matrix

on:
  pull_request:
    paths:
      - ".github/workflows/emuchef-execution-feature-matrix.yml"
      - "apps/emuchef-app/**"
      - "crates/emuchef-rust-backend/**"
      - "docs/manual/phase-6c-1-non-root-executor-qualification.md"
      - "docs/qualification/phase-6c2-root-executor.md"
      - "docs/qualification/phase-6c2-root-executor-evidence-template.md"
      - "fixtures/android/phase-6c2-root/**"
      - "tests/fixtures/phase-6c/non-root/**"
      - "tools/phase-6c-fixture.mjs"
      - "tools/phase-6c-fixture.test.mjs"
      - "scripts/build-phase-6c-android-fixture.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emuchef-execution-feature-matrix.yml"
      - "apps/emuchef-app/**"
      - "crates/emuchef-rust-backend/**"
      - "docs/manual/phase-6c-1-non-root-executor-qualification.md"
      - "docs/qualification/phase-6c2-root-executor.md"
      - "docs/qualification/phase-6c2-root-executor-evidence-template.md"
      - "fixtures/android/phase-6c2-root/**"
      - "tests/fixtures/phase-6c/non-root/**"
      - "tools/phase-6c-fixture.mjs"
      - "tools/phase-6c-fixture.test.mjs"
      - "scripts/build-phase-6c-android-fixture.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emuchef-execution-feature-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qualification-fixture:
    name: Phase 6C.1 Android fixture contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install locked Android SDK tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Test fixture contract tooling
        run: node --test tools/phase-6c-fixture.test.mjs
      - name: Verify committed fixture APK contract
        run: >-
          node tools/phase-6c-fixture.mjs
          --apk tests/fixtures/phase-6c/non-root/android-fixture/fixture.apk
          --metadata tests/fixtures/phase-6c/non-root/android-fixture/fixture-metadata.json
          --checksum tests/fixtures/phase-6c/non-root/android-fixture/fixture.apk.sha256
          --aapt2 "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          --apksigner "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
      - name: Rebuild and verify fixture semantics
        run: >-
          bash scripts/build-phase-6c-android-fixture.sh --output "$RUNNER_TEMP/fixture.apk"
          && node tools/phase-6c-fixture.mjs --semantic-only
          --apk "$RUNNER_TEMP/fixture.apk"
          --metadata tests/fixtures/phase-6c/non-root/android-fixture/fixture-metadata.json
          --checksum tests/fixtures/phase-6c/non-root/android-fixture/fixture.apk.sha256
          --aapt2 "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          --apksigner "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

  security-policy:
    name: Execution feature policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/emuchef-app/package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci --prefix apps/emuchef-app
      - name: Verify execution feature policy
        run: npm --prefix apps/emuchef-app run test:security

  rust-feature-matrix:
    name: Tauri Rust (${{ matrix.configuration }})
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: simulation-only
            cargo_arguments: --no-default-features
          - configuration: real-execution
            cargo_arguments: --no-default-features --features real-execution
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/emuchef-app/src-tauri
      - name: Check formatting
        run: cargo fmt --manifest-path apps/emuchef-app/src-tauri/Cargo.toml -- --check
      - name: Check Tauri Rust configuration
        run: cargo check --locked --manifest-path apps/emuchef-app/src-tauri/Cargo.toml ${{ matrix.cargo_arguments }}
      - name: Test Tauri Rust configuration
        run: cargo test --locked --manifest-path apps/emuchef-app/src-tauri/Cargo.toml ${{ matrix.cargo_arguments }}
