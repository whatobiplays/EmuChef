# Example authored app definition template.
# Copy this file into authored/apps/ and replace the placeholder values.
# Files under templates/ are examples only and are never loaded by EmuChef.
# Accepted top-level keys:
# - schema_version: 1
# - kind: app_definition
# - id, name, package_id
# - description, category, launcher_activity, metadata
# - artifacts, permission_sets, targets

schema_version: 1
kind: app_definition
id: example.app.template
name: Example App Name
description: Replace this with a short human-readable app description.
# category is a free-form string. Stable labels used in this repository are:
# emulator, launcher, utility, frontend, service
category: emulator
# package_id is the canonical Android application ID of this app. It carries the
# app's install and launch identity and must be unique across the catalog.
package_id: com.example.app
# launcher_activity is optional. When present it must be exactly one fully
# qualified activity class name.
# launcher_activity: com.example.app.MainActivity

# App-owned artifacts. Each entry is a named resource whose kind is apk or file.
# The apk kind carries APK semantics (the file must be an APK whose manifest
# package equals package_id, and it is eligible for installation); the file kind
# is a generic app-owned resource.
#
# Exactly three source strategies exist, and each accepts only its own fields:
# - user_provided: the bound recipe input supplies the file at run time
# - direct_url: a durable public HTTPS address with an optional lowercase
#   sha256 checksum of 64 hexadecimal characters
# - latest_release: a provider release policy resolved when the artifact is
#   needed, with a required prerelease policy and an optional asset pattern
artifacts:
  apk:
    kind: apk
    name: Example App APK
    source:
      strategy: user_provided
  # A direct URL source:
  # source:
  #   strategy: direct_url
  #   url: https://downloads.example.invalid/example-app.apk
  #   sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  # A latest-release source. The provider is github, gitlab, or forgejo, and
  # base_url is the public service origin with no path, query, or fragment:
  # repository is owner/repository for GitHub and Forgejo, while GitLab also
  # accepts nested namespaces such as group/subgroup/project. asset_pattern is
  # optional: without it, selection is by artifact kind alone and still
  # requires exactly one eligible asset. invert_asset_pattern is only legal
  # together with asset_pattern, and a false value is omitted because it states
  # the default behavior.
  # source:
  #   strategy: latest_release
  #   provider: github
  #   base_url: https://github.com
  #   repository: owner/repository
  #   asset_pattern: '^Example-App-[0-9.]+-arm64-v8a[.]apk$'
  #   invert_asset_pattern: true
  #   prerelease: false
  config_bundle:
    kind: file
    description: Optional configuration archive copied by a recipe.
    source:
      strategy: direct_url
      url: https://downloads.example.invalid/example-config.zip

# Optional permission sets for standardized package permission automation.
# Exactly two sets exist. baseline describes automation that runs without root
# and elevated describes automation that requires root. Either set may be
# absent, and a set that is present must contain at least one action.
permission_sets:
  baseline:
    runtime:
      - permission: android.permission.POST_NOTIFICATIONS
        android_api_min: 33
  elevated:
    app_ops:
      - op: MANAGE_EXTERNAL_STORAGE
        mode: allow

# Optional named destinations owned by this app on a target device. kind is file
# or directory, location is app_data, external_app_data, shared_storage, or
# absolute_device_path, and path depends on the chosen location.
targets:
  shared_config:
    kind: directory
    location: shared_storage
    path: ExampleApp
  app_config:
    kind: directory
    location: app_data
    path: config

# Optional non-authoritative metadata. Canonical top-level schema names are
# reserved and may only appear nested under this section.
metadata:
  homepage: https://example.invalid/app
  tags:
    - example
    - template
