# Example authored app definition template.
# Copy this file into authored/apps/ and replace placeholder values.
# Files under templates/ are examples only and are never loaded by EmuChef.
# Accepted top-level values:
# - schema_version: 1
# - kind: app_definition

schema_version: 1
kind: app_definition
id: example.app.template
name: Example App Name
description: Replace with a short human-readable app description.
# category is currently a free-form string. Use stable labels like:
# emulator, launcher, utility, frontend, service
category: emulator
package:
  # primary is the canonical Android package name.
  primary: com.example.app
  # aliases are optional alternate package names, such as beta/fork variants.
  aliases:
    - com.example.app.beta
install_source:
  # install_source.type is currently free-form metadata.
  # Common examples in this repo:
  # - local_file
  # install_source.resolver is also currently free-form.
  # Common examples in this repo:
  # - none
  type: local_file
  resolver: none
  options:
    # options is resolver-specific free-form metadata.
    path: sample_artifacts/example-app.apk
tracking_source:
  # tracking_source.type is currently free-form metadata.
  # Common examples in this repo:
  # - obtainium_config_snapshot
  type: obtainium_config_snapshot
  config_snapshot: vendor/obtainium/apps/example-app.json
  app_id: example-app
artifacts:
  # For each artifact entry:
  # - required: true | false | null
  # - supported: true | false | null
  # Use required when the artifact must exist.
  # Use supported when the artifact category is or is not supported.
  apk:
    required: true
  shared_storage_config:
    supported: false
  app_data_config:
    supported: false
  byo_apk:
    required: false
provisioning:
  # launch_once_recommended: true | false
  launch_once_recommended: false
  shared_storage_paths:
    - /sdcard/ExampleApp/
  app_data_paths: []
  config_targets:
    - id: shared_storage_main
      # config_targets[].type is currently free-form.
      # Common examples:
      # - shared_storage
      # - app_data
      type: shared_storage
      path: /sdcard/ExampleApp/
inputs:
  # Accepted input values:
  # - type: file | directory
  # - role: apk | bios | roms | config_bundle | generic
  - id: byo_apk_path
    type: file
    role: apk
    label: Example APK
    description: Optional local APK override for this app.
    required: false
    # multiple: true | false
    multiple: false
    validation:
      # validation.path_kind: file | directory | null
      # allowed_extensions entries may be written with or without the dot:
      # .apk and apk are treated the same.
      must_exist: true
      allowed_extensions:
        - .apk
      path_kind: file
    default: null
    metadata: {}
metadata:
  homepage: https://example.invalid/app
  tags:
    - example
    - template
