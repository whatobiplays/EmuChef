# Example authored device plan template.
# Copy this file into authored/device_plans/ and replace placeholder values.
# Device plans point at a device profile and choose default recipes.

schema_version: 1
kind: device_plan
id: example.device_plan.template
name: Example Base Setup
description: Replace with the setup this plan should apply by default.
device_profile_ref: example.device_profile.template
recipes:
  - recipe_ref: example.recipe.template
    selected_by_default: true
defaults:
  show_advanced_steps: false
overrides:
  # Top-level full binding refs can participate in planner binding resolution.
  example.recipe.template.$example_source_dir: /absolute/path/to/example-assets
  # Nested metadata like config_variants is informational unless wired later.
  config_variants:
    vendor_family: example
metadata:
  tags:
    - base_setup
    - template
