[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emuchef"
version = "0.1.0"
description = "Android Emulation Handheld Provisioner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Daniel" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
# Retained temporarily for legacy/reference/developer/golden CLI workflows while
# Rust CLI parity remains fixture-scoped. This is not a supported production path
# for the Tauri editor runtime.
emuchef = "emuchef.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
