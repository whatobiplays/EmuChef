[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emuchef"
version = "0.1.0"
description = "Android Emulation Handheld Provisioner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Daniel" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Retained temporarily for legacy/reference/developer editor workflows. PySide6
# is not required by the Tauri editor runtime or packaged Rust sidecar app.
pyside-editor = ["PySide6>=6.8"]

[project.scripts]
# Retained temporarily for legacy/reference/developer/golden CLI workflows while
# Rust CLI parity remains fixture-scoped. This is not a supported production path
# for the Tauri editor runtime.
emuchef = "emuchef.cli:main"
# Retained temporarily for legacy/reference/developer PySide editor workflows.
# This is not the active editor runtime and is not a Tauri fallback backend.
emuchef-editor = "emuchef_editor.app.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
