[package]
name = "emuchef-rust-backend"
version = "0.1.0"
edition = "2021"
description = "EmuChef Rust CLI and runtime"
license = "GPL-3.0-only"
autobins = false
default-run = "emuchef"

[[bin]]
name = "emuchef"
path = "src/main.rs"

[[bin]]
name = "emuchef-plan-shadow"
path = "src/bin/emuchef-plan-shadow.rs"

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
