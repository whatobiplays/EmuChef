[package]
name = "emuchef-rust-backend"
version = "0.1.0"
edition = "2021"
description = "EmuChef Rust CLI and runtime"
license = "GPL-3.0-only"
autobins = false
default-run = "emuchef"

[[bin]]
name = "emuchef"
path = "src/main.rs"

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusty-axml = { version = "=0.2.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.53", features = ["formatting"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rcgen = "0.14.8"
