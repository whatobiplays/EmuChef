[package]
name = "emuchef-rust-backend"
version = "0.1.0"
edition = "2021"
description = "Experimental EmuChef Rust backend protocol skeleton"
license = "GPL-3.0-only"

[dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
