recipe_dependencies: []
provides:
  features:
    - planner_grant_permissions
inputs: {}
artifacts: {}
artifact_groups: {}
steps:
  - id: grant
    type: grant_permissions
    name: Grant Permissions
    user_toggleable: false
    dependencies: []
    constraints:
      capabilities: []
