    skip_if: []
    params:
      runtime:
        - package_name: com.example.app
          name: android.permission.POST_NOTIFICATIONS
          required: false
      appops:
        - package_name: com.example.app
          op: MANAGE_EXTERNAL_STORAGE
          mode: allow
          required: false
      policy:
        on_failure: warn
        require_all: false
    verify: []
