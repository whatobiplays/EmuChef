schema_version: 1
kind: recipe
id: planner.phase6n.dependency_graph
name: Planner Phase 6N Dependency Graph
description: Selected recipe with multiple dependencies and overlapping local ids.
recipe_dependencies:
  - planner.phase6n.dep_a
  - planner.phase6n.dep_b
provides:
  features:
    - planner_phase6n_dependency_graph
inputs:
  cfg:
    type: file
    role: generic
    label: Main Config
    description: Main recipe config.
    required: true
    multiple: false
    default: main.cfg
    validation:
      must_exist: false
      allowed_extensions:
        - cfg
      path_kind: file
artifacts:
  shared_asset:
    type: remote_file
    url: https://example.com/main.zip
    cache: default
artifact_groups: {}
steps:
  - id: resolve
    type: resolve_artifacts
    name: Resolve Main
    user_toggleable: false
    dependencies: []
    constraints:
      capabilities: []
      conflicts_with: []
    skip_if: []
    params:
      artifacts:
        - shared_asset
    verify: []
  - id: seed
    type: copy_files
    name: Seed Main
    user_toggleable: true
    dependencies:
      - resolve
    constraints:
      capabilities:
        - shared_storage_write
      conflicts_with: []
    skip_if: []
    params:
      source:
        ref: inputs.cfg
      dest: /sdcard/Main.cfg
    verify: []
