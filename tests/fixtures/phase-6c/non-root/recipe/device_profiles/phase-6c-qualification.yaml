schema_version: 1
kind: device_profile
id: phase6c.qualification.device.non_root
name: Phase 6C Non-root Qualification Device
description: Development-only profile for an explicitly selected Android 11 or newer non-root test device.
match:
  manufacturer_contains: []
  brand_contains: []
  model_patterns:
    - '.+'
  android_version:
    min: 11
capability_defaults:
  adb_available: true
  apk_install: true
  shared_storage_write: true
  app_launch: true
  shell_command: true
  package_remove_for_user: true
  root_shell: false
  app_data_write: false
device_tags:
  - qualification
  - non_root_android
metadata:
  purpose: phase_6c_qualification
