schema_version: 1
kind: app_definition
id: phase6c.qualification.fixture
name: Phase 6C Qualification Fixture
description: Local non-root executor qualification fixture for development-only testing.
category: utility
package_id: com.emuchef.fixture
launcher_activity: com.emuchef.fixture.MainActivity
artifacts:
  apk:
    kind: apk
    name: Qualification Fixture APK
    source:
      strategy: user_provided
permission_sets:
  baseline:
    runtime:
      - permission: android.permission.CAMERA
    app_ops:
      - op: CAMERA
        mode: allow
targets:
  qualification_config:
    kind: directory
    location: shared_storage
    path: EmuChefQualification/com.emuchef.fixture
metadata:
  tags:
    - qualification
    - non_root
