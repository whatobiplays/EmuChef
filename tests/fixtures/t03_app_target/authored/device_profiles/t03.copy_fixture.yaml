schema_version: 1
kind: device_profile
id: t03.copy_fixture
name: T03 Synthetic Copy Fixture
description: Test-only capability profile for controlled protected App Target qualification.
match:
  model_patterns:
    - '(?i)sdk_gphone'
    - '(?i)synthetic app target'
  android_version:
    min: 11
capability_defaults:
  adb_available: true
  apk_install: true
  shared_storage_write: true
  app_launch: true
  shell_command: true
  package_remove_for_user: true
  root_shell: true
  app_data_write: true
device_tags:
  - t03_test_fixture
